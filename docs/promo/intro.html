<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>تطبيق الأعمال الصالحة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;800;900&family=Amiri:wght@700&display=swap" rel="stylesheet">
<style>
  :root{--forest:#0F3B25;--deep:#0A2A1A;--green:#1E5E3B;--sage:#9BB896;--cream:#F7F1E3;--gold:#D9B65C;}
  *{box-sizing:border-box;margin:0}
  html,body{background:#222}
  /* The picture: 1080 x 1350 (4:5). Screenshot this element. */
  .poster{
    position:relative;width:1080px;height:1350px;margin:0 auto;overflow:hidden;
    font-family:'Tajawal',sans-serif;color:var(--cream);text-align:center;
    background:
      radial-gradient(circle at 50% 36%, #2a7a4d 0%, rgba(42,122,77,0) 55%),
      linear-gradient(180deg,var(--forest),var(--deep));
    display:flex;flex-direction:column;align-items:center;
  }
  /* soft geometric lattice */
  .poster::before{
    content:"";position:absolute;inset:0;opacity:.09;
    background-image:
      linear-gradient(45deg,var(--cream) 1px,transparent 1px),
      linear-gradient(-45deg,var(--cream) 1px,transparent 1px);
    background-size:90px 90px;
    -webkit-mask-image:radial-gradient(circle at 50% 38%,#000 0%,transparent 75%);
            mask-image:radial-gradient(circle at 50% 38%,#000 0%,transparent 75%);
  }
  .frame{position:absolute;inset:34px;border:2px solid rgba(217,182,92,.55);border-radius:36px}
  .frame::after{content:"";position:absolute;inset:10px;border:1px solid rgba(217,182,92,.25);border-radius:28px}

  .top{position:relative;margin-top:96px;font-size:30px;font-weight:500;letter-spacing:.5px;color:var(--gold)}
  .logo-wrap{
    position:relative;margin-top:44px;width:430px;height:430px;border-radius:50%;
    background:#fff;padding:0;
    box-shadow:0 0 0 14px rgba(247,241,227,.12),0 0 0 15px rgba(217,182,92,.6),0 40px 90px rgba(0,0,0,.45);
  }
  .logo-wrap img{width:100%;height:100%;display:block;border-radius:50%}
  h1{
    position:relative;margin-top:52px;font-size:112px;line-height:1.1;font-weight:900;color:#fff;
    text-shadow:0 6px 30px rgba(0,0,0,.35);
  }
  .rule{position:relative;margin:30px 0 28px;display:flex;align-items:center;gap:18px}
  .rule i{display:block;width:150px;height:2px;background:linear-gradient(90deg,transparent,var(--gold))}
  .rule i:last-child{transform:scaleX(-1)}
  .rule b{width:14px;height:14px;background:var(--gold);transform:rotate(45deg)}
  .slogan{position:relative;font-family:'Amiri','Tajawal',serif;font-size:60px;line-height:1.5;color:var(--gold);font-weight:700}
  .sub{position:relative;margin-top:14px;font-size:30px;font-weight:400;color:rgba(247,241,227,.85)}

  .foot{
    position:absolute;bottom:84px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:16px;
  }
  .foot small{font-size:24px;color:rgba(247,241,227,.75);font-weight:500}
  .badge{background:var(--cream);border-radius:28px;padding:14px 34px;box-shadow:0 14px 40px rgba(0,0,0,.35)}
  .badge img{height:150px;display:block}
</style>
</head>
<body>
<div class="poster" id="poster">
  <div class="frame"></div>
  <div class="top">نقدّم لكم</div>
  <div class="logo-wrap"><img src="logo.png" alt=""></div>
  <h1>الأعمال الصالحة</h1>
  <div class="rule"><i></i><b></b><i></i></div>
  <div class="slogan">معًا نصنع الخير… ونجمع الأثر</div>
  <div class="sub">كل فعاليات الجمعية وأعمالها في تطبيق واحد</div>
  <div class="foot">
    
    <div class="badge"><img src="islah-tarbawi.png" alt="الإصلاح التربوي"></div>
  </div>
</div>
</body>
</html>
